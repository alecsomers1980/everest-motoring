version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades need a human; security fixes still come through Dependabot security updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
